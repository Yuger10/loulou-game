<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2EC4C6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lagon">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Le Lagon Magique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ocean-deep:#123B4F;
    --lagoon:#2EC4C6;
    --lagoon-dark:#1FA3A5;
    --sand:#FFF3DE;
    --coral:#FF8969;
    --bubblegum:#FFAAD4;
    --sun:#FFCB4C;
    --foam:#FFFFFF;
    --shadow: 0 6px 0 rgba(18,59,79,0.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Quicksand',sans-serif;
    color:var(--ocean-deep);
    background:linear-gradient(180deg,#BDEBEA 0%, var(--lagoon) 45%, var(--lagoon-dark) 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  h1,h2,h3,.title-font,button{font-family:'Baloo 2',sans-serif;}
  button{touch-action:manipulation;}
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:transparent;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* bulles décoratives flottantes */
  .bubble{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.35);
    animation:float 9s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-22px);}
  }

  /* topbar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:16px 18px 6px;
    z-index:2;
  }
  .topbar h1{
    font-size:1.2rem;
    color:var(--foam);
    text-shadow:0 2px 0 rgba(18,59,79,0.25);
    margin:0;
    flex:1;
  }
  .coin-pill{
    background:var(--foam);
    border-radius:999px;
    padding:6px 14px 6px 8px;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    box-shadow:var(--shadow);
    font-size:1.05rem;
  }
  .coin-pill span.icon{font-size:1.2rem;}
  .coin-pill.bump{animation:bump .35s ease;}
  @keyframes bump{0%{transform:scale(1);} 40%{transform:scale(1.25);} 100%{transform:scale(1);}}
  .sound-btn{
    border:none;
    background:var(--foam);
    border-radius:999px;
    width:40px; height:40px;
    font-size:1.2rem;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .sound-btn:active{transform:translateY(3px); box-shadow:none;}

  main{flex:1; position:relative; z-index:1; padding:6px 16px 12px;}
  .view{display:none;}
  .view.active{display:block; animation:appear .25s ease;}
  @keyframes appear{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* Lagon view */
  .lagon-intro{
    text-align:center;
    color:var(--foam);
    margin:6px 0 14px;
  }
  .lagon-intro p{margin:4px 0 0; font-weight:600; opacity:.95;}

  /* scène décorée */
  .scene{
    background:linear-gradient(180deg,#8FE3E6 0%, #FFF3DE 100%);
    border-radius:24px;
    min-height:84px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px;
    padding:10px 12px 8px;
    position:relative;
  }
  .scene .deco{font-size:2rem; animation:sway 4s ease-in-out infinite;}
  .scene .deco:nth-child(even){animation-delay:1.5s;}
  .scene .empty{font-size:.8rem; font-weight:700; opacity:.6; padding:14px 0;}
  .btn-deco{
    position:absolute;
    top:-8px; right:-4px;
    border:none;
    background:var(--sun);
    border-radius:999px;
    padding:6px 12px;
    font-weight:700;
    font-size:.8rem;
    box-shadow:0 4px 0 #D9A62A;
    cursor:pointer;
  }
  .btn-deco:active{transform:translateY(3px); box-shadow:none;}
  .deco-row .emoji{font-size:2rem;}
  .deco-row.owned{opacity:.75; background:#E8FBE9;}

  /* jeu suite logique */
  .seq-row{
    display:flex; justify-content:center; align-items:center; gap:6px;
    background:var(--foam); border-radius:18px; padding:18px 8px; margin-bottom:16px; flex-wrap:wrap;
  }
  .seq-row span{font-size:2rem;}
  .seq-row .q{
    width:44px; height:44px; border-radius:12px; border:3px dashed var(--lagoon-dark);
    display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--lagoon-dark); font-size:1.4rem;
  }
  .seq-options{display:flex; gap:10px; justify-content:center;}
  .seq-btn{
    flex:1; max-width:90px; border:none; border-radius:16px; padding:12px 0; font-size:2rem;
    background:var(--foam); box-shadow:var(--shadow); cursor:pointer;
  }
  .seq-btn:active{transform:translateY(4px); box-shadow:none;}

  /* accueil / prénom / avatar */
  #welcome{
    position:fixed; inset:0; z-index:40;
    background:linear-gradient(180deg,#BDEBEA 0%, var(--lagoon) 50%, var(--lagoon-dark) 100%);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    text-align:center;
  }
  #welcome.show{display:flex;}
  #welcome h1{
    font-size:2rem; color:var(--foam); margin:0 0 4px;
    text-shadow:0 3px 0 rgba(18,59,79,.25);
  }
  #welcome .sub{color:var(--foam); font-weight:600; margin-bottom:18px;}
  .welcome-card{
    background:var(--sand); border-radius:28px; padding:20px; width:100%; max-width:400px;
    box-shadow:var(--shadow);
  }
  .welcome-card label{display:block; font-weight:700; margin-bottom:8px; font-size:.95rem;}
  #name-input{
    width:100%; border:3px solid var(--lagoon); border-radius:16px;
    padding:12px 14px; font-size:1.1rem; font-family:'Baloo 2',sans-serif; font-weight:700;
    text-align:center; color:var(--ocean-deep); background:var(--foam); margin-bottom:16px;
  }
  .avatar-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:18px;}
  .avatar-opt{
    border:3px solid transparent; background:var(--foam); border-radius:18px;
    font-size:1.7rem; padding:8px 0; cursor:pointer;
  }
  .avatar-opt.sel{border-color:var(--coral); background:#FFE7E0; transform:scale(1.06);}
  .avatar-pill{
    background:var(--foam); border-radius:999px; padding:4px 12px 4px 6px;
    display:flex; align-items:center; gap:6px; font-weight:700; font-size:.9rem;
    box-shadow:var(--shadow); border:none; cursor:pointer;
    margin-right:auto; max-width:50%; overflow:hidden;
  }
  .avatar-pill .av{font-size:1.2rem;}
  .avatar-pill span:last-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* quêtes du jour */
  .quests{
    background:rgba(255,255,255,.92);
    border-radius:22px; padding:12px 14px; margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .quests h3{margin:0 0 8px; font-size:.95rem; display:flex; align-items:center; gap:6px;}
  .quests h3 .chest{margin-left:auto; font-size:1.3rem;}
  .quest{
    display:flex; align-items:center; gap:8px; padding:5px 0; font-size:.85rem; font-weight:600;
  }
  .quest .tick{font-size:1.1rem;}
  .quest .txt{flex:1;}
  .quest .cnt{font-weight:800; color:var(--lagoon-dark); font-size:.8rem;}
  .quest.done .txt{text-decoration:line-through; opacity:.6;}
  .quest-bar{height:7px; background:#E4EEF1; border-radius:999px; overflow:hidden; margin-top:6px;}
  .quest-bar i{display:block; height:100%; background:var(--coral); border-radius:999px; transition:width .4s;}
  .btn-chest{
    width:100%; border:none; border-radius:14px; padding:10px; margin-top:10px;
    font-weight:700; background:var(--sun); color:var(--ocean-deep); cursor:pointer;
    box-shadow:0 4px 0 #D9A62A;
  }
  .btn-chest:active{transform:translateY(3px); box-shadow:none;}

  /* album */
  .album-section h3{color:var(--foam); text-shadow:0 2px 0 rgba(18,59,79,.25); font-size:1rem; margin:16px 0 8px;}
  .album-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .album-cell{
    background:var(--foam); border-radius:18px; padding:10px 4px; text-align:center;
    box-shadow:var(--shadow); min-height:72px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .album-cell.locked{background:rgba(255,255,255,.45);}
  .album-cell .emoji{font-size:1.7rem;}
  .album-cell.locked .emoji{filter:grayscale(1); opacity:.35;}
  .album-cell .nm{font-size:.62rem; font-weight:700; line-height:1.1;}
  .album-progress{
    background:rgba(255,255,255,.92); border-radius:18px; padding:12px 14px;
    font-weight:700; font-size:.9rem; box-shadow:var(--shadow);
  }

  .btn-speak{
    border:none; background:var(--sun); border-radius:999px;
    width:34px; height:34px; font-size:1rem; cursor:pointer; flex-shrink:0;
    box-shadow:0 3px 0 #D9A62A;
  }
  .btn-speak:active{transform:translateY(2px); box-shadow:none;}
  .speech.with-voice{display:flex; align-items:center; gap:10px;}
  .speech.with-voice .txt{flex:1;}
  .level-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.9);
    color:var(--ocean-deep);
    border-radius:999px;
    padding:6px 14px;
    font-weight:700;
    font-size:.85rem;
    margin-bottom:8px;
    box-shadow:var(--shadow);
  }
  .level-bar{
    width:70px; height:8px;
    background:#E4EEF1;
    border-radius:999px;
    overflow:hidden;
  }
  .level-bar i{display:block; height:100%; background:var(--sun); border-radius:999px; transition:width .4s;}
  .islands{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .island{
    background:var(--foam);
    border:none;
    border-radius:28px;
    padding:18px 10px 14px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition:transform .1s;
    position:relative;
  }
  .island:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(18,59,79,0.15);}
  .island .emoji{font-size:2.6rem; animation:sway 3s ease-in-out infinite;}
  .island:nth-child(2) .emoji{animation-delay:1s;}
  .island:nth-child(3) .emoji{animation-delay:2s;}
  @keyframes sway{0%,100%{transform:rotate(-4deg);} 50%{transform:rotate(4deg);}}
  .island .name{font-weight:700; font-size:.95rem; text-align:center;}
  .island .loot{font-size:.9rem; opacity:.8;}
  .island:nth-child(3){grid-column:1 / span 2; max-width:220px; margin:0 auto;}

  /* Sac view */
  .sac-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:8px;
  }
  .item-card{
    background:var(--foam);
    border-radius:20px;
    padding:12px 6px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .item-card.crafted{background:linear-gradient(160deg,#FFF9E8,#FFE7F3);}
  .item-card .emoji{font-size:2rem; display:block;}
  .item-card .name{font-size:.8rem; font-weight:700; margin-top:4px;}
  .item-card .qty{font-size:.75rem; color:var(--lagoon-dark); font-weight:700;}
  .empty-state{
    background:rgba(255,255,255,.85);
    border-radius:20px;
    padding:22px;
    text-align:center;
    font-weight:600;
    margin-top:10px;
  }
  .reset-btn{
    display:block;
    margin:28px auto 0;
    border:none;
    background:rgba(255,255,255,.35);
    color:var(--foam);
    border-radius:999px;
    padding:8px 14px;
    font-size:.75rem;
    font-weight:700;
    cursor:pointer;
  }

  /* Marché view */
  .tabs{display:flex; gap:6px; margin-bottom:14px;}
  .tab-btn{
    flex:1;
    border:none;
    border-radius:16px;
    padding:10px 2px;
    background:rgba(255,255,255,.55);
    color:var(--ocean-deep);
    font-weight:700;
    font-size:.78rem;
    cursor:pointer;
  }
  .tab-btn.active{background:var(--foam); box-shadow:var(--shadow);}
  .market-row{
    background:var(--foam);
    border-radius:18px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .market-row .emoji{font-size:1.8rem;}
  .market-row .info{flex:1;}
  .market-row .info .name{font-weight:700; font-size:.9rem;}
  .market-row .info .sub{font-size:.75rem; color:var(--lagoon-dark); font-weight:600;}
  .btn-small{
    border:none;
    border-radius:14px;
    padding:8px 14px;
    background:var(--coral);
    color:white;
    font-weight:700;
    font-size:.82rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-small:active{transform:translateY(2px);}
  .btn-small:disabled{background:#C9C9C9; cursor:not-allowed;}
  .recipe-card{
    background:var(--foam);
    border-radius:20px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .recipe-card.tier2{background:linear-gradient(160deg,#FFF9E8,#FFE7F3);}
  .recipe-card .result{display:flex; align-items:center; gap:8px; font-weight:700; margin-bottom:8px;}
  .recipe-card .result .emoji{font-size:1.7rem;}
  .recipe-card .result .price{margin-left:auto; font-size:.8rem; color:var(--lagoon-dark);}
  .recipe-ingredients{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .ingredient-pill{
    background:var(--sand);
    border-radius:14px;
    padding:5px 10px;
    font-size:.8rem;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .ingredient-pill.ok{background:#DFF6DE; color:#1E7A34;}
  .ingredient-pill.ko{background:#FFE2DC; color:#B4472F;}
  .btn-craft{
    width:100%;
    border:none;
    border-radius:14px;
    padding:10px;
    font-weight:700;
    background:var(--lagoon-dark);
    color:white;
    cursor:pointer;
  }
  .btn-craft:disabled{background:#C9C9C9; cursor:not-allowed;}

  /* bottom nav */
  nav.bottomnav{
    display:flex;
    background:var(--foam);
    border-radius:26px 26px 0 0;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 14px rgba(18,59,79,0.15);
    z-index:2;
  }
  nav.bottomnav button{
    flex:1;
    border:none;
    background:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:6px 0;
    font-size:.72rem;
    font-weight:700;
    color:#9AAAB2;
    cursor:pointer;
    position:relative;
  }
  nav.bottomnav button .icon{font-size:1.5rem;}
  nav.bottomnav button.active{color:var(--lagoon-dark);}
  nav.bottomnav button .badge{
    position:absolute;
    top:2px; right:22%;
    background:var(--coral);
    color:white;
    font-size:.65rem;
    border-radius:999px;
    min-width:18px; height:18px;
    line-height:18px;
    padding:0 5px;
  }

  /* modal overlay */
  #overlay{
    position:fixed; inset:0;
    background:rgba(18,59,79,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
  }
  #overlay.show{display:flex;}
  #modal{
    background:var(--sand);
    width:100%;
    max-width:480px;
    border-radius:28px 28px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    animation:slideup .22s ease;
    max-height:88vh;
    overflow-y:auto;
  }
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  #modal h2{margin:0 0 8px; font-size:1.25rem;}
  .char-header{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .char-header .emoji{font-size:2.4rem;}
  .speech{
    background:var(--foam);
    border-radius:18px;
    padding:14px 16px;
    font-weight:600;
    margin-bottom:16px;
  }
  .btn-primary{
    width:100%;
    border:none;
    border-radius:16px;
    padding:14px;
    font-size:1.05rem;
    font-weight:700;
    background:var(--coral);
    color:white;
    cursor:pointer;
    box-shadow:0 5px 0 #D96A50;
  }
  .btn-primary:active{transform:translateY(4px); box-shadow:none;}
  .btn-ghost{
    width:100%;
    border:none;
    background:none;
    color:var(--ocean-deep);
    font-weight:700;
    padding:10px;
    margin-top:6px;
    cursor:pointer;
    opacity:.7;
  }

  /* minigames */
  .game-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .game-head h2{flex:1; text-align:center; margin:0;}
  .game-progress{
    display:flex; justify-content:center; gap:6px; margin:6px 0 12px;
  }
  .game-progress i{
    width:10px; height:10px; border-radius:50%;
    background:rgba(18,59,79,.15);
  }
  .game-progress i.on{background:var(--sun);}

  .memory-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px;}
  .memory-grid.cols3{grid-template-columns:repeat(3,1fr);}
  .mcard{
    aspect-ratio:1/1;
    background:var(--lagoon-dark);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.8rem;
    cursor:pointer;
    color:transparent;
    transition:background .15s, transform .2s;
    background-image:radial-gradient(circle at 50% 50%, rgba(255,255,255,.18) 0 30%, transparent 32%);
  }
  .mcard.flipped, .mcard.matched{background:var(--foam); color:var(--ocean-deep); background-image:none;}
  .mcard.flipped{transform:scale(1.05);}
  .mcard.matched{opacity:.55; transform:scale(.95);}

  .count-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    background:var(--foam);
    border-radius:18px;
    padding:16px;
    margin-bottom:16px;
    justify-content:center;
  }
  .count-row span{font-size:1.8rem;}
  .num-options{display:flex; gap:10px; justify-content:center;}
  .num-btn{
    flex:1;
    max-width:80px;
    border:none;
    border-radius:16px;
    padding:16px 0;
    font-size:1.4rem;
    font-weight:800;
    background:var(--foam);
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .num-btn:active{transform:translateY(4px); box-shadow:none;}

  .diff-row{
    display:flex;
    justify-content:center;
    gap:10px;
    background:var(--foam);
    border-radius:18px;
    padding:18px 8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .diff-item{
    font-size:2rem;
    padding:8px;
    border-radius:14px;
    cursor:pointer;
  }
  .diff-item:active{background:rgba(0,0,0,0.06);}

  .puzzle-row{display:flex; gap:10px; justify-content:center; margin-bottom:16px; flex-wrap:wrap;}
  .puzzle-btn{
    width:64px; height:64px;
    border:none;
    border-radius:16px;
    background:var(--foam);
    box-shadow:var(--shadow);
    font-size:1.5rem;
    font-weight:800;
    cursor:pointer;
  }
  .puzzle-btn.done{background:var(--sun); box-shadow:none;}
  .puzzle-hint{text-align:center; font-weight:700; margin-bottom:10px; color:var(--ocean-deep); opacity:.75; font-size:.85rem;}

  .shake{animation:shake .35s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  .reward-box{text-align:center; padding:8px 0 4px;}
  .reward-box .big-emoji{font-size:3.4rem; display:block; margin-bottom:6px; animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(0);} 70%{transform:scale(1.2);} 100%{transform:scale(1);}}

  /* confettis */
  #confetti{position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden;}
  .confetti-piece{
    position:absolute;
    top:-20px;
    width:10px; height:14px;
    border-radius:3px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg); opacity:1;}
    100%{transform:translateY(110vh) rotate(720deg); opacity:.6;}
  }

  #toast{
    position:fixed;
    bottom:96px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ocean-deep);
    color:white;
    font-weight:700;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    transition:opacity .2s, transform .2s;
    z-index:20;
    font-size:.9rem;
    white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>

<script>
/* ---------- Données ---------- */
const ITEMS = {
  coquillage:{emoji:'🐚', name:'Coquillage', price:2},
  perle:{emoji:'🦪', name:'Perle', price:3},
  ruban:{emoji:'🎀', name:'Ruban', price:2},
  fleur:{emoji:'🌸', name:'Fleur', price:2},
  etoile:{emoji:'⭐', name:'Étoile', price:4},

};
const CRAFTED = {

  bouquet:{emoji:'💐', name:'Bouquet enchanté', price:8,

const ALL_ITEMS = Object.assign({}, ITEMS, CRAFTED);

const CHARACTERS = {
  sirene:{
    emoji:'🧜‍♀️', name:'Marina', title:'la sirène',
    loot:['coquillage','perle'],
    texts:[
      "Aide-moi à retrouver un trésor du lagon, tu veux bien ?",

    texts:[
      "J'ai besoin de toi pour un petit défi magique !",

const GAME_TYPES = ['memory','count','diff','puzzle','sequence'];

const DECOS = {
  palmier:{emoji:'🌴', name:'Palmier', price:8},

  tortue:{emoji:'🐢', name:'Tortue', price:12},
  arcenciel:{emoji:'🌈', name:'Arc-en-ciel', price:20},
  chateau:{emoji:'🏰', name:'Château de sable', price:25},
  bateau:{emoji:'⛵', name:'Petit voilier', price:18},
  fee:{emoji:'🧚‍♀️', name:'Fée du lagon', price:35},
  sirene2:{emoji:'🐚', name:'Coquillage géant', price:30},
  lune:{emoji:'🌙', name:'Lune magique', price:40},

const MISSIONS_PER_LEVEL = 5;
const SAVE_KEY = 'lagon-magique-save';

const AVATARS = ['👧','👩‍🦰','👧‍🦱','👧‍🦲','🧚‍♀️','👸','🧜‍♀️','🦸‍♀️','🐱','🦄'];

/* ---------- État ---------- */
let state = {
  coins: 5,
  inventory: {},
  missions: 0,
  sound: true,
  voice: true,
  newItems: 0,
  decos: [],
  name: '',
  avatar: '👧',

};

function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){}
}
function resetState(){
  state = { coins:5, inventory:{}, missions:0, sound:state.sound, voice:state.voice,
            newItems:0, decos:[], name:state.name, avatar:state.avatar, seen:{}, quests:null };
  save();
}

/* ---------- Profil (prénom + avatar) ---------- */
function hello(){ return state.name ? state.name : ''; }
function renderProfile(){
  document.querySelector('#avatar-pill .av').textContent = state.avatar || '👧';
  document.getElementById('player-name').textContent = state.name || 'Toi';
}
let pendingAvatar = '👧';
function openWelcome(){
  const grid = document.getElementById('avatar-grid');
  pendingAvatar = state.avatar || '👧';
  grid.innerHTML = AVATARS.map(a=>`<button class="avatar-opt ${a===pendingAvatar?'sel':''}" data-av="${a}">${a}</button>`).join('');
  grid.querySelectorAll('.avatar-opt').forEach(b=>{
    b.onclick = ()=>{
      pendingAvatar = b.dataset.av;
      grid.querySelectorAll('.avatar-opt').forEach(x=>x.classList.toggle('sel', x===b));
      playSound('tap');
    };
  });
  document.getElementById('name-input').value = state.name || '';
  document.getElementById('welcome').classList.add('show');
}
function closeWelcome(){
  const name = document.getElementById('name-input').value.trim().slice(0,12);
  state.name = name;
  state.avatar = pendingAvatar;
  save();
  renderProfile();
  document.getElementById('welcome').classList.remove('show');
  playSound('win');
  const who = name ? name : 'toi';
  speak(`Bonjour ${who} ! Bienvenue dans le lagon magique.`);
  showToast(name ? `Bonjour ${name} ! ✨` : 'Bonne aventure ! ✨');
  renderLagon();
}

/* ---------- Quêtes du jour ---------- */
const QUEST_TEMPLATES = [
  ()=>{ const k = pickRandom(Object.keys(ITEMS)); const goal = 2 + Math.floor(Math.random()*2);
        return {type:'collect', target:k, goal, n:0, label:`Gagne ${goal} ${ITEMS[k].name.toLowerCase()}${goal>1?'s':''} ${ITEMS[k].emoji}`}; },
  ()=>{ const c = pickRandom(Object.keys(CHARACTERS)); const goal = 2;
        return {type:'char', target:c, goal, n:0, label:`Joue ${goal} fois avec ${CHARACTERS[c].name} ${CHARACTERS[c].emoji}`}; },
  ()=>{ const goal = 3; return {type:'win', target:null, goal, n:0, label:`Réussis ${goal} missions 🎮`}; },
  ()=>{ const k = pickRandom(['collier','bouquet','couronne','baguette']);
        return {type:'craft', target:k, goal:1, n:0, label:`Fabrique un ${CRAFTED[k].name.toLowerCase()} ${CRAFTED[k].emoji}`}; },
  ()=>{ const goal = 2; return {type:'sell', target:null, goal, n:0, label:`Vends ${goal} objets au marché 🏪`}; },
];
function today(){ const d = new Date(); return d.toISOString().slice(0,10); }
function ensureQuests(){
  if(!state.quests || state.quests.date !== today()){
    const picks = shuffle(QUEST_TEMPLATES).slice(0,3).map(f=>f());
    state.quests = { date: today(), list: picks, claimed:false };
    save();
  }
  return state.quests;
}
function questProgress(type, target, n=1){
  const q = ensureQuests();
  let changed = false;
  q.list.forEach(item=>{
    if(item.n >= item.goal) return;
    if(item.type !== type) return;
    if(item.target && item.target !== target) return;
    item.n = Math.min(item.goal, item.n + n);
    changed = true;
    if(item.n >= item.goal){
      playSound('good');
      showToast(`✅ ${item.label}`);
    }
  });
  if(changed){ save(); renderQuests(); }
}
function questsDone(){ const q = ensureQuests(); return q.list.every(i=>i.n>=i.goal); }
function renderQuests(){
  const q = ensureQuests();
  const el = document.getElementById('quests');
  if(!el) return;
  const done = q.list.filter(i=>i.n>=i.goal).length;
  el.innerHTML = `
    <h3>📜 Mes missions du jour <span class="chest">${questsDone() && !q.claimed ? '🎁' : (q.claimed?'✅':'📦')}</span></h3>
    ${q.list.map(i=>`
      <div class="quest ${i.n>=i.goal?'done':''}">
        <span class="tick">${i.n>=i.goal?'✅':'⭕'}</span>
        <span class="txt">${i.label}</span>
        <span class="cnt">${i.n}/${i.goal}</span>
      </div>`).join('')}
    <div class="quest-bar"><i style="width:${(done/q.list.length)*100}%"></i></div>
    ${questsDone() && !q.claimed ? `<button class="btn-chest" id="btn-chest">🎁 Ouvrir le coffre !</button>` : ''}
  `;
  const b = document.getElementById('btn-chest');
  if(b) b.onclick = openChest;
}
function openChest(){
  const q = ensureQuests();
  if(q.claimed || !questsDone()) return;
  q.claimed = true;
  const bonusCoins = 15;
  const gift = pickRandom(Object.keys(ITEMS));
  addCoins(bonusCoins);
  addItem(gift,1); markSeen(gift);
  state.newItems += 1; save(); renderBadge();
  playSound('win'); confetti(); vibrate([60,40,120,40,160]);
  const who = hello();
  speak(`${who ? who+', b' : 'B'}ravo ! Tu as fini toutes tes missions du jour. Tu gagnes ${bonusCoins} pièces et ${ITEMS[gift].name}.`);
  openModal(`
    <div class="reward-box">
      <span class="big-emoji">🎁</span>
      <h2>Coffre du jour ouvert !</h2>
      <div class="speech" style="display:flex; align-items:center; justify-content:center; gap:10px;">
        <span style="font-size:2rem;">🪙</span><span><strong>+${bonusCoins} pièces</strong></span>
      </div>
      <div class="speech" style="display:flex; align-items:center; justify-content:center; gap:10px; background:#FFF9E8;">
        <span style="font-size:2rem;">${ITEMS[gift].emoji}</span><span><strong>${ITEMS[gift].name}</strong></span>
      </div>
    </div>
    <button class="btn-primary" id="btn-yay">Merci ! 🎉</button>
  `);
  document.getElementById('btn-yay').onclick = ()=>{ playSound('tap'); closeModal(); renderLagon(); };
  renderQuests();
}

/* ---------- Album ---------- */
function markSeen(key){
  if(!state.seen) state.seen = {};
  if(!state.seen[key]){ state.seen[key] = true; save(); return true; }
  return false;
}
function renderAlbum(){
  const el = document.getElementById('album-content');
  const seen = state.seen || {};
  const cell = (k, it, unlocked)=>`
    <div class="album-cell ${unlocked?'':'locked'}">
      <span class="emoji">${unlocked?it.emoji:'❓'}</span>
      <span class="nm">${unlocked?it.name:'?'}</span>
    </div>`;
  const objKeys = Object.keys(ALL_ITEMS);
  const decoKeys = Object.keys(DECOS);
  const objFound = objKeys.filter(k=>seen[k]||countItem(k)>0).length;
  const decoFound = decoKeys.filter(k=>state.decos.includes(k)).length;
  const total = objKeys.length + decoKeys.length;
  const found = objFound + decoFound;
  el.innerHTML = `
    <div class="album-progress">
      ${found===total ? '🏆 Album complet, bravo !' : `✨ ${found} / ${total} découverts`}
      <div class="quest-bar"><i style="width:${(found/total)*100}%"></i></div>
    </div>
    <div class="album-section">
      <h3>🎒 Objets</h3>
      <div class="album-grid">${objKeys.map(k=>cell(k, ALL_ITEMS[k], !!(seen[k]||countItem(k)>0))).join('')}</div>
      <h3>🎨 Décorations</h3>
      <div class="album-grid">${decoKeys.map(k=>cell(k, DECOS[k], state.decos.includes(k))).join('')}</div>
    </div>`;
}

/* ---------- Utilitaires ---------- */
function addItem(key, qty=1){ state.inventory[key] = (state.inventory[key]||0) + qty; save(); }
function removeItem(key, qty=1){ state.inventory[key] = Math.max(0, (state.inventory[key]||0) - qty); save(); }
function countItem(key){ return state.inventory[key] || 0; }
function addCoins(n){
  state.coins += n; save(); renderCoins();
  const pill = document.getElementById('coin-pill');
  pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
}
function renderCoins(){ document.getElementById('coin-count').textContent = state.coins; }
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
function level(){ return 1 + Math.floor(state.missions / MISSIONS_PER_LEVEL); }
function levelProgress(){ return (state.missions % MISSIONS_PER_LEVEL) / MISSIONS_PER_LEVEL; }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 1600);
}

function vibrate(pattern){
  if(navigator.vibrate) navigator.vibrate(pattern);
}

function shakeEl(el){
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}

function wrongFeedback(el){
  playSound('wrong');
  vibrate(80);
  shakeEl(el);
  el.style.opacity=.4; setTimeout(()=>el.style.opacity=1,400);
}

/* ---------- Sons (Web Audio, aucun fichier) ---------- */
let audioCtx = null;
function tone(freq, start, dur, type='sine', vol=.18){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, audioCtx.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + start + .01);
  g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + start + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(audioCtx.currentTime + start);
  o.stop(audioCtx.currentTime + start + dur + .05);
}
function playSound(kind){
  if(!state.sound) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    if(kind==='tap') tone(660, 0, .08, 'triangle', .1);
    else if(kind==='good') { tone(523, 0, .12); tone(784, .1, .16); }
    else if(kind==='wrong') tone(220, 0, .2, 'square', .08);
    else if(kind==='win') { [523,659,784,1047].forEach((f,i)=>tone(f, i*.11, .22)); }
    else if(kind==='coin') { tone(988, 0, .08, 'triangle'); tone(1319, .07, .14, 'triangle'); }
  }catch(e){}
}
document.getElementById('sound-btn').addEventListener('click', ()=>{
  // cycle : son+voix → son seul → muet
  if(state.sound && state.voice){ state.voice=false; }
  else if(state.sound){ state.sound=false; }
  else { state.sound=true; state.voice=true; }
  save(); renderSoundBtn();
  if(!state.voice && window.speechSynthesis) speechSynthesis.cancel();
  if(state.sound) playSound('tap');
  showToast(state.sound ? (state.voice ? '🗣️ Sons + voix' : '🔊 Sons seulement') : '🔇 Silence');
});
function renderSoundBtn(){
  document.getElementById('sound-btn').textContent = state.sound ? (state.voice ? '🗣️' : '🔊') : '🔇';
}

/* ---------- Voix (Web Speech) ---------- */
// Mots prononcés pour chaque emoji (singulier, pluriel)
const EMOJI_WORDS = {
  '🐚':['coquillage','coquillages'], '🦪':['perle','perles'], '🎀':['ruban','rubans'],
  '🌸':['fleur','fleurs'], '⭐':['étoile','étoiles'], '🌟':['étoile qui brille','étoiles qui brillent'],
  '💎':['gemme','gemmes'], '🐠':['poisson','poissons'], '🐟':['petit poisson','petits poissons'],
  '🦋':['papillon','papillons'], '🐝':['abeille','abeilles'], '🐌':['escargot','escargots'],
  '🌺':['hibiscus','hibiscus'], '🎁':['cadeau','cadeaux'], '🍓':['fraise','fraises'],
  '🌙':['lune','lunes'], '🦄':['licorne','licornes'], '🧜‍♀️':['sirène','sirènes'],
  '📿':['collier','colliers'], '💐':['bouquet','bouquets'], '👑':['couronne','couronnes'],
  '🪄':['baguette magique','baguettes magiques'], '🏆':['trésor','trésors'],
  '🪙':['',''], '🎮':['',''], '✨':['',''], '🎉':['',''], '🔊':['',''], '🔈':['',''],
};
function emojiWord(emoji, plural=false){
  const w = EMOJI_WORDS[emoji];
  return w ? w[plural?1:0] : '';
}
// "de étoiles" → "d'étoiles"
function elide(s){
  return s.replace(/\b(de|que|le|la|ne|se|je|me|te) (?=[aéèêàeiouôûh])/gi, (m,a)=> a[0]+"'");
}
function toSpoken(text){
  // remplace chaque emoji connu par son mot, puis enlève le reste
  let s = text.replace(/<[^>]+>/g,'');
  const keys = Object.keys(EMOJI_WORDS).sort((a,b)=>b.length-a.length);
  for(const k of keys){ s = s.split(k).join(' '+emojiWord(k)+' '); }
  s = s.replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu,'');
  s = s.replace(/\s+/g,' ').replace(/\s+([?!,.:])/g,'$1').trim();
  return elide(s);
}

// Choix d'une voix féminine française, la plus naturelle possible
const VOICE_PREFS = ['Audrey','Aurélie','Aurelie','Google français','Marie','Amélie','Amelie','Virginie','Hortense','Julie','Denise','Vivienne','Flo (Français (France))','Sandy (Français (France))','Shelley (Français (France))','Flo','Sandy','Shelley'];
const VOICE_MALE = /thomas|jacques|eddy|reed|rocko|grandpa|nicolas|paul|henri|daniel|claude|yannick/i;
let chosenVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));
  if(!voices.length) return null;
  const score = v=>{
    let s = 0;
    const i = VOICE_PREFS.findIndex(p=>v.name.toLowerCase().startsWith(p.toLowerCase()));
    if(i>=0) s += 1000 - i*10;
    if(/premium|enhanced|natural|neural|amélior/i.test(v.name)) s += 200;
    if(/^fr-FR$/i.test(v.lang)) s += 50;
    if(VOICE_MALE.test(v.name)) s -= 500;
    if(/grandma|compact/i.test(v.name)) s -= 100;
    if(v.localService) s += 5;
    return s;
  };
  chosenVoice = voices.sort((a,b)=>score(b)-score(a))[0];
  return chosenVoice;
}
if('speechSynthesis' in window){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!state.voice || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(toSpoken(text));
    u.lang = 'fr-FR';
    u.rate = .92;
    u.pitch = 1.0;
    const v = chosenVoice || pickVoice();
    if(v) u.voice = v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function bindSpeakButtons(){
  document.querySelectorAll('[data-say]').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); speak(b.dataset.say); };
  });
}
function speechBubble(text, extraStyle=''){
  return `<div class="speech with-voice" style="${extraStyle}">
    <span class="txt">${text}</span>
    <button class="btn-speak" data-say="${text.replace(/"/g,'&quot;').replace(/<[^>]+>/g,'')}" aria-label="Écouter">🔈</button>
  </div>`;
}

/* ---------- Confettis ---------- */
function confetti(){
  const box = document.getElementById('confetti');
  const colors = ['#FF8969','#FFAAD4','#FFCB4C','#2EC4C6','#FFFFFF','#B388FF'];
  for(let i=0;i<50;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + '%';
    p.style.background = pickRandom(colors);
    p.style.animationDuration = (1.4 + Math.random()*1.2) + 's';

/* ---------- Mini-jeux ---------- */
let lastGame = null;
function startMinigame(){
  // évite de tomber deux fois de suite sur le même jeu
  const type = pickRandom(GAME_TYPES.filter(t=>t!==lastGame));
  lastGame = type;
  if(type==='memory') renderMemory();
  else if(type==='count') renderCount();
  else if(type==='diff') renderDiff();
  else if(type==='sequence') renderSequence();
  else renderPuzzle();
}

function gameHeader(title, hint, spoken){
  const say = (spoken || hint).replace(/"/g,'&quot;');
  return `
    <div class="game-head">
      <span style="width:40px"></span>
      <h2>${title}</h2>
      <button class="sound-btn" id="btn-quit" aria-label="Retour" style="width:40px;height:40px;font-size:1rem;">✖️</button>
    </div>
    <p class="puzzle-hint" style="margin-top:8px; display:flex; align-items:center; justify-content:center; gap:8px;">
      <span>${hint}</span>

    </p>
  `;
}
function bindQuit(){
  const b = document.getElementById('btn-quit');
  if(b) b.onclick = ()=> { playSound('tap'); window.speechSynthesis && speechSynthesis.cancel(); closeModal(); };
  bindSpeakButtons();
  // lit la consigne une seule fois par mini-jeu (le mémo se re-rend à chaque clic)
  const hint = document.querySelector('.puzzle-hint [data-say]');
  if(hint && hint.dataset.say !== bindQuit._last){ bindQuit._last = hint.dataset.say; speak(hint.dataset.say); }
}
function progressDots(done, total){
  return `<div class="game-progress">${Array.from({length:total},(_,i)=>`<i class="${i<done?'on':''}"></i>`).join('')}</div>`;
}

function onMissionWin(){
  bindQuit._last = null;
  const c = CHARACTERS[currentChar] || CHARACTERS.sirene;
  const prevLevel = level();
  state.missions += 1;
  const key = pickRandom(c.loot);
  // bonus : de temps en temps un objet rare en plus
  const bonus = Math.random() < 0.2 ? pickRandom(Object.keys(ITEMS)) : null;
  addItem(key,1); markSeen(key);
  if(bonus){ addItem(bonus,1); markSeen(bonus); }
  state.newItems += bonus ? 2 : 1;
  save();
  renderBadge();
  questProgress('win', null, 1);
  questProgress('char', currentChar, 1);
  questProgress('collect', key, 1);
  if(bonus) questProgress('collect', bonus, 1);
  const it = ITEMS[key];
  const levelUp = level() > prevLevel;

  playSound('win');
  vibrate([60,40,120]);
  confetti();
  const who = hello();
  const praise = pickRandom([
    `Bravo${who?' '+who:''}, bien joué !`,
    `Super${who?' '+who:''}, tu es trop forte !`,
    `Génial, c'est réussi !`,
    `Waouh${who?' '+who:''}, quelle championne !`,
  ]);
  setTimeout(()=> speak(`${levelUp ? `Niveau ${level()} ! ` : ''}${praise} ${c.name} t'offre ${it.name}${bonus ? `, et une surprise : ${ITEMS[bonus].name}` : ''}.`), 300);

  openModal(`
    <div class="reward-box">
      <span class="big-emoji">${levelUp ? '🌟' : '🎉'}</span>
      <h2>${levelUp ? `Niveau ${level()} !` : praise}</h2>
      <div class="speech" style="display:flex; align-items:center; justify-content:center; gap:10px;">
        <span style="font-size:2rem;">${it.emoji}</span>
        <span>${c.name} t'offre : <strong>${it.name}</strong></span>
      </div>
      ${bonus ? `<div class="speech" style="display:flex; align-items:center; justify-content:center; gap:10px; background:#FFF9E8;">
        <span style="font-size:2rem;">${ITEMS[bonus].emoji}</span>
        <span>Surprise ! <strong>${ITEMS[bonus].name}</strong> en plus ✨</span>
      </div>` : ''}
    </div>
    <button class="btn-primary" id="btn-yay">Super !</button>
    <button class="btn-ghost" id="btn-again">Encore une mission 🎮</button>
  `);
  document.getElementById('btn-yay').onclick = ()=> { playSound('tap'); closeModal(); renderLagon(); };
  document.getElementById('btn-again').onclick = ()=> { playSound('tap'); renderLagon(); startMinigame(); };
}

/* Jeu 1 : mémoire */
function renderMemory(){
  const pairs = level()===1 ? 3 : (level()===2 ? 4 : 6);
  const pool = shuffle(Object.values(ALL_ITEMS).map(i=>i.emoji)).slice(0,pairs);
  const cards = shuffle([...pool, ...pool]).map((e,i)=>({id:i, emoji:e, flipped:false, matched:false}));
  let first=null, lock=false;
  const cols3 = pairs===3;

  function render(){
    openModal(`
      ${gameHeader('🧠 Jeu de mémoire','Retrouve les paires identiques')}
      ${progressDots(cards.filter(c=>c.matched).length/2, pairs)}
      <div class="memory-grid ${cols3?'cols3':''}">
        ${cards.map(c=>`<div class="mcard ${c.matched?'matched':(c.flipped?'flipped':'')}" data-id="${c.id}">${(c.flipped||c.matched)?c.emoji:''}</div>`).join('')}
      </div>
    `);
    bindQuit();
    document.querySelectorAll('.mcard').forEach(el=>{
      el.onclick = ()=>{
        const id = Number(el.dataset.id);
        const card = cards.find(c=>c.id===id);
        if(lock || card.flipped || card.matched) return;
        playSound('tap');
        card.flipped = true;
        render();
        if(!first){ first = card; return; }
        lock = true;
        const second = card;
        const isMatch = first.emoji===second.emoji;
        setTimeout(()=>{
          if(isMatch){
            first.matched = true; second.matched = true;
            playSound('good');
          } else {
            first.flipped = false; second.flipped = false;
            playSound('wrong');
          }
          first = null; lock = false;
          render();
          if(cards.every(c=>c.matched)) setTimeout(onMissionWin, 300);
        }, isMatch ? 350 : 700);
      };
    });
  }
  render();
}

/* Jeu 2 : compter */
function renderCount(){
  const emoji = pickRandom(['⭐','🐚','🌸','🦪','🐠','🦋']);
  const min = 3, max = Math.min(10, 5 + level()*2); // niv.1 : 3–7, niv.2 : 3–9, niv.3+ : 3–10
  const n = min + Math.floor(Math.random()*(max-min+1));
  let options = new Set([n]);
  while(options.size<3){ options.add(Math.max(1, n + (Math.floor(Math.random()*5)-2))); }
  options = shuffle([...options]);

  openModal(`
    ${gameHeader('🔢 Compte avec moi', `Combien y a-t-il de ${emoji} ?`, `Combien y a-t-il de ${emojiWord(emoji,true)} ?`)}
    <div class="count-row">${Array(n).fill(emoji).map(e=>`<span>${e}</span>`).join('')}</div>
    <div class="num-options">
      ${options.map(o=>`<button class="num-btn" data-v="${o}">${o}</button>`).join('')}
    </div>
  `);
  bindQuit();
  document.querySelectorAll('.num-btn').forEach(btn=>{
    btn.onclick = ()=>{
      if(Number(btn.dataset.v)===n) onMissionWin();
      else wrongFeedback(btn);
    };
  });
}

/* Jeu 3 : trouver l'intruse */
function renderDiff(){
  const total = level()>=3 ? 9 : (level()===2 ? 8 : 6);
  // niveaux élevés : l'intruse ressemble un peu plus aux autres
  const sets = level()>=2
    ? [['🐚','🐌'],['🌸','🌺'],['⭐','🌟'],['🦋','🐝'],['🎀','🎁'],['🐠','🐟']]
    : [['🐚','🦄'],['🦋','💎'],['🌸','🍓'],['⭐','🌙'],['🎀','🧜‍♀️']];
  const [base, odd] = pickRandom(sets);
  const items = Array(total-1).fill(base);
  const oddPos = Math.floor(Math.random()*total);
  items.splice(oddPos,0,odd);

  openModal(`
    ${gameHeader("🔍 Trouve l'intruse", "Touche celle qui n'est pas comme les autres")}
    <div class="diff-row">
      ${items.map((e)=>`<span class="diff-item" data-odd="${e===odd}">${e}</span>`).join('')}
    </div>
  `);
  bindQuit();
  document.querySelectorAll('.diff-item').forEach(el=>{
    el.onclick = ()=>{
      if(el.dataset.odd==='true') onMissionWin();
      else wrongFeedback(el);
    };
  });
}

/* Jeu 5 : suite logique */
function renderSequence(){
  const symbols = shuffle(['🐚','⭐','🌸','🎀','💎','🦋','🐠']).slice(0,3);
  const [A,B,C] = symbols;
  const patterns = level()===1
    ? [[A,B]]
    : level()===2 ? [[A,B],[A,A,B],[A,B,C]]
    : [[A,B,B],[A,A,B],[A,B,C],[A,B,A,C]];
  const pattern = pickRandom(patterns);
  const shown = pattern.length===2 ? 5 : (pattern.length===3 ? 6 : 7);
  const seq = Array.from({length:shown},(_,i)=>pattern[i%pattern.length]);
  const answer = pattern[shown%pattern.length];
  const options = shuffle([...new Set([answer, ...symbols])]).slice(0,3);
  if(!options.includes(answer)) options[0] = answer;

  openModal(`
    ${gameHeader('🔮 La suite magique', 'Regarde bien… quelle image vient après ?')}
    <div class="seq-row">
      ${seq.map(e=>`<span>${e}</span>`).join('')}
      <span class="q">?</span>
    </div>
    <div class="seq-options">
      ${shuffle(options).map(o=>`<button class="seq-btn" data-v="${o}">${o}</button>`).join('')}
    </div>
  `);
  bindQuit();
  document.querySelectorAll('.seq-btn').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.dataset.v===answer){
        document.querySelector('.seq-row .q').textContent = answer;
        document.querySelector('.seq-row .q').style.border='none';
        setTimeout(onMissionWin, 350);
      } else wrongFeedback(btn);
    };
  });
}

/* Jeu 4 : puzzle (remettre les nombres dans l'ordre) */
function renderPuzzle(){
  const count = Math.min(8, 3 + level()); // niv.1 : 4, niv.2 : 5 …
  const nums = shuffle(Array.from({length:count},(_,i)=>i+1));
  let next = 1;
  openModal(`
    ${gameHeader('🧩 Petit puzzle', `Touche les nombres dans l'ordre : 1 → ${count}`)}
    ${progressDots(0, count)}
    <div class="puzzle-row">
      ${nums.map(n=>`<button class="puzzle-btn" data-n="${n}">${n}</button>`).join('')}
    </div>
  `);
  bindQuit();
  document.querySelectorAll('.puzzle-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const n = Number(btn.dataset.n);
      if(btn.classList.contains('done')) return;
      if(n===next){
        btn.classList.add('done');
        playSound('good');
        next++;
        document.querySelectorAll('.game-progress i').forEach((d,i)=>d.classList.toggle('on', i<next-1));
        if(next===count+1) setTimeout(onMissionWin, 300);
      } else {
        wrongFeedback(btn);
      }
    };
  });
}

function renderFusionner(el){
  el.innerHTML = Object.entries(CRAFTED).map(([key,c])=>{

    return `<div class="recipe-card ${c.tier===2?'tier2':''}">
      <div class="result"><span class="emoji">${c.emoji}</span><span>${c.name}</span><span class="price">🪙 ${c.price}</span></div>
      <div class="recipe-ingredients">
        ${need.map(([ik,qty])=>{
          const has = countItem(ik);
          const ok = has>=qty;
          return `<span class="ingredient-pill ${ok?'ok':'ko'}">${ALL_ITEMS[ik].emoji} ${has}/${qty}</span>`;
        }).join('')}
      </div>
      <button class="btn-craft" data-craft="${key}" ${canCraft?'':'disabled'}>${canCraft?'Créer ✨':'Il manque des objets'}</button>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-craft]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.craft;
      const c = CRAFTED[key];
      Object.entries(c.recipe).forEach(([ik,qty])=> removeItem(ik,qty));
      addItem(key,1); markSeen(key);
      questProgress('craft', key, 1);
      playSound('win');
      confetti();
      showToast(`${c.emoji} ${c.name} créé !`);
      renderFusionner(el);
    };
  });
}

/* ---------- Init ---------- */
load();
// marque comme déjà vus les objets déjà possédés (anciennes sauvegardes)
Object.keys(state.inventory||{}).forEach(k=>{ if(state.inventory[k]>0) markSeen(k); });
renderCoins();
renderSoundBtn();
renderBadge();
renderProfile();
ensureQuests();
renderLagon();
document.getElementById('avatar-pill').addEventListener('click', ()=>{ playSound('tap'); openWelcome(); });
document.getElementById('btn-start').addEventListener('click', closeWelcome);
document.getElementById('name-input').addEventListener('keydown', e=>{ if(e.key==='Enter') closeWelcome(); });
if(!state.name) openWelcome();
if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
