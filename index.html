<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2EC4C6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lagon">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Le Lagon Magique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <div class="bubble" style="width:26px;height:26px; top:70px; left:20px; animation-delay:0s;"></div>
  <div class="bubble" style="width:16px;height:16px; top:140px; right:36px; animation-delay:1.4s;"></div>
  <div class="bubble" style="width:20px;height:20px; top:230px; left:60px; animation-delay:2.6s;"></div>

  <header class="topbar">
    <button class="avatar-pill" id="avatar-pill"><span class="av">👧</span><span id="player-name">Toi</span></button>
    <button class="sound-btn" id="sound-btn" aria-label="Son">🔊</button>
    <div class="coin-pill" id="coin-pill"><span class="icon">🪙</span><span id="coin-count">0</span></div>
  </header>

  <main>
    <section id="view-lagon" class="view active">
      <div class="lagon-intro">
        <div class="level-pill" id="level-pill"></div>
        <p id="lagon-intro-text">Touche un personnage pour l'aider ✨</p>
      </div>
      <div class="turn-bar" id="turn-bar" hidden></div>
      <div class="island-map" id="island-map"></div>
      <div class="map-next" id="map-next" hidden></div>
      <h3 class="world-title" id="world-title"></h3>
      <div class="quests" id="quests"></div>
      <div class="scene" id="scene"></div>
      <div class="islands" id="islands"></div>
    </section>

    <section id="view-sac" class="view">
      <h2 style="color:var(--foam); text-shadow:0 2px 0 rgba(18,59,79,.25);">🎒 Mon sac</h2>
      <div id="sac-content"></div>
      <button class="reset-btn" id="reset-btn">⚙️ Mon profil / Recommencer</button>
    </section>

    <section id="view-marche" class="view">
      <h2 style="color:var(--foam); text-shadow:0 2px 0 rgba(18,59,79,.25); margin-bottom:10px;">🏪 Le marché</h2>
      <div class="tabs">
        <button class="tab-btn active" data-tab="vendre">Vendre</button>
        <button class="tab-btn" data-tab="echanger">Échanger</button>
        <button class="tab-btn" data-tab="fusionner">Fusionner</button>
        <button class="tab-btn" data-tab="acheter">Acheter</button>
      </div>
      <div id="marche-content"></div>
    </section>

    <section id="view-album" class="view">
      <h2 style="color:var(--foam); text-shadow:0 2px 0 rgba(18,59,79,.25);">📖 Mon album</h2>
      <div id="album-content"></div>
    </section>
  </main>

  <nav class="bottomnav">
    <button class="navbtn active" data-view="lagon"><span class="icon">🏝️</span>Lagon</button>
    <button class="navbtn" data-view="sac"><span class="icon">🎒</span>Mon sac<span class="badge" id="sac-badge" hidden></span></button>
    <button class="navbtn" data-view="marche"><span class="icon">🏪</span>Marché</button>
    <button class="navbtn" data-view="album"><span class="icon">📖</span>Album</button>
  </nav>
</div>

<div id="overlay">
  <div id="modal"></div>
</div>
<div id="splash">
  <div class="fish" style="top:22%; animation-delay:0s;">🐠</div>
  <div class="fish" style="top:70%; animation-delay:3.5s;">🐟</div>
  <div class="fish" style="top:45%; animation-delay:6s;">🐢</div>
  <h1 class="title">🌊<br>Le Lagon Magique</h1>
  <div class="stars">⭐ ✨ ⭐</div>
  <div class="cast"><span>🧜‍♀️</span><span>🦄</span><span>💃</span></div>
  <div class="hello" id="splash-hello">Prête pour l'aventure ?</div>
  <button class="btn-primary" id="btn-splash-play">Jouer 🎮</button>
  <div class="waves"></div>
</div>
<div id="welcome">
  <h1>🌊 Le Lagon Magique</h1>
  <p class="sub">Bienvenue dans le lagon ✨</p>
  <div class="welcome-card">
    <label for="name-input">Comment tu t'appelles ?</label>
    <input id="name-input" type="text" maxlength="12" placeholder="Ton prénom" autocomplete="off">
    <label>Choisis ton avatar</label>
    <div class="avatar-grid" id="avatar-grid"></div>
    <button class="btn-primary" id="btn-start">C'est parti ! 🎮</button>
  </div>
</div>
<div id="turn-overlay"></div>
<div id="confetti"></div>
<div id="toast"></div>


<script src="js/data.js"></script>
<script src="js/players.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/map.js"></script>
<script src="js/minigames.js"></script>
<script src="js/market.js"></script>
<script src="js/profiles-ui.js"></script>
<script src="js/init.js"></script>
</body>
</html>
