# Généré par cothon (scripts/presets.sh, ADR 0011) depuis le preset lefthook/base. Ne pas modifier :
# les écarts du projet vont dans .cothon/local/lefthook.yml, appliqué après ce fichier.
extends:
  - .cothon/local/lefthook.yml
pre-commit:
  commands:
    format:
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,json,css,md}'
      run: ./node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,jsx,mjs,cjs,ts,tsx}'
      run: ./node_modules/.bin/oxlint --deny-warnings --no-error-on-unmatched-pattern {staged_files}
