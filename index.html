<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2EC4C6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lagon">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Le Lagon Magique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="island.css">
<link rel="stylesheet" href="js/entities/character/characters.css">
</head>
<body>

<div id="app">
  <div class="bubble" style="width:26px;height:26px; top:70px; left:20px; animation-delay:0s;"></div>
  <div class="bubble" style="width:16px;height:16px; top:140px; right:36px; animation-delay:1.4s;"></div>
  <div class="bubble" style="width:20px;height:20px; top:230px; left:60px; animation-delay:2.6s;"></div>

  <header class="topbar">
    <button class="avatar-pill" id="avatar-pill" aria-label="Les joueurs"><span class="av">👧</span><span id="player-name">Toi</span></button>
    <button class="icon-btn" id="quests-btn" aria-label="Mes missions du jour"><span data-ui-icon="missions">📜</span><span class="badge" id="quest-badge" hidden></span></button>
    <button class="icon-btn" id="story-btn" aria-label="Mon histoire"><span data-ui-icon="histoire">📖</span></button>
    <button class="icon-btn" id="sound-btn" aria-label="Son">🔊</button>
    <div class="coin-pill" id="coin-pill"><span class="icon" data-ui-icon="piece">🪙</span><span id="coin-count">0</span></div>
  </header>

  <div class="multi-strip" id="multi-strip">
    <div class="turn-bar" id="turn-bar" hidden></div>
    <div class="race-track" id="race-track" hidden></div>
  </div>

  <main>
    <!-- 1. Carte : naviguer entre les îles -->
    <section id="view-carte" class="view active">
      <div class="view-head">
        <h2>🗺️ La carte</h2>
        <div class="level-pill" id="level-pill"></div>
      </div>
      <div class="install-hint" id="install-hint" hidden>
        <span aria-hidden="true">📲</span>
        <span class="ih-txt">Installe le jeu sur l'écran d'accueil pour ne jamais perdre ta partie.</span>
        <button type="button" class="chip-btn" data-install-how>Comment ?</button>
        <button type="button" class="ih-close" data-install-close aria-label="Masquer ce message">✕</button>
      </div>
      <div class="island-map" id="island-map"></div>
      <div class="map-next" id="map-next" hidden></div>
      <div class="island-card" id="island-card"></div>
    </section>

    <!-- 2. Île : les personnages et le décor de l'île courante -->
    <section id="view-ile" class="view">
      <div class="view-head">
        <h2 id="world-title">🌊 Le Lagon</h2>
        <button class="chip-btn" id="btn-back-map">🗺️ Carte</button>
      </div>
      <p class="view-hint" id="lagon-intro-text">Touche un personnage pour l'aider ✨</p>
      <div class="islands" id="islands"></div>
      <div class="scene" id="scene"></div>
      <div class="quests" id="quests"></div>
    </section>

    <!-- 3. Sac & Album -->
    <section id="view-sac" class="view">
      <div class="view-head"><h2>🎒 Mon sac</h2></div>
      <div class="tabs">
        <button class="tab-btn active" data-sactab="sac">🎒 Objets</button>
        <button class="tab-btn" data-sactab="album">📖 Album</button>
        <button class="tab-btn" data-sactab="look">🎩 Mon look</button>
      </div>
      <div id="sac-content"></div>
      <div id="album-content" hidden></div>
      <div id="look-content" hidden></div>
      <button class="reset-btn" id="reset-btn">⚙️ Mon profil / Recommencer</button>
    </section>

    <!-- 4. Marché -->
    <section id="view-marche" class="view">
      <div class="view-head"><h2>🏪 Le marché</h2></div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="vendre">Vendre</button>
        <button class="tab-btn" data-tab="echanger">Échanger</button>
        <button class="tab-btn" data-tab="fusionner">Fusionner</button>
        <button class="tab-btn" data-tab="acheter">Acheter</button>
      </div>
      <div id="marche-content"></div>
    </section>
  </main>

  <nav class="bottomnav">
    <button class="navbtn active" data-view="carte"><span class="icon" data-ui-icon="carte">🗺️</span>Carte</button>
    <button class="navbtn" data-view="ile"><span class="icon" data-ui-icon="ile">🏝️</span>Île</button>
    <button class="navbtn" data-view="sac"><span class="icon" data-ui-icon="sac">🎒</span>Sac<span class="badge" id="sac-badge" hidden></span></button>
    <button class="navbtn" data-view="marche"><span class="icon" data-ui-icon="marche">🏪</span>Marché</button>
  </nav>
</div>

<div id="overlay">
  <div id="modal" role="dialog" aria-modal="true">
    <div class="modal-handle" id="modal-handle"><span></span></div>
    <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="splash">
  <!-- poissons et tortue dessinés, tournés dans le sens où ils nagent (les emoji regardent à gauche sur iPhone/iPad) -->
  <div class="fish" style="top:22%; animation-delay:0s;"><svg viewBox="0 0 64 40" aria-hidden="true"><path d="M5 8 L19 20 L5 32 Z" fill="#FF8A3D" stroke="#123B4F" stroke-width="2" stroke-linejoin="round"/><path d="M30 7 L38 1 L45 9" fill="#FFCB4C" stroke="#123B4F" stroke-width="1.8" stroke-linejoin="round"/><ellipse cx="37" cy="20" rx="22" ry="14" fill="#FF8A3D" stroke="#123B4F" stroke-width="2"/><path d="M30 7.5 C33 14 33 26 30 32.5 M45 8.5 C47 14 47 26 45 31.5" stroke="#fff" stroke-width="3.6" fill="none"/><circle cx="51" cy="17" r="3.2" fill="#123B4F"/><circle cx="52" cy="16" r="1" fill="#fff"/><path d="M56 23 Q54 25.5 51.5 24.5" stroke="#123B4F" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div>
  <div class="fish small" style="top:70%; animation-delay:3.5s;"><svg viewBox="0 0 56 34" aria-hidden="true"><path d="M4 6 L17 17 L4 28 Z" fill="#5AB0F2" stroke="#123B4F" stroke-width="2" stroke-linejoin="round"/><ellipse cx="33" cy="17" rx="19" ry="12" fill="#5AB0F2" stroke="#123B4F" stroke-width="2"/><path d="M25 8.5 Q29 17 25 25.5" stroke="#2F7FC0" stroke-width="2.2" fill="none"/><path d="M30 26 L35 31 L38 27" fill="#8CCBF7" stroke="#123B4F" stroke-width="1.6" stroke-linejoin="round"/><circle cx="44" cy="14" r="2.8" fill="#123B4F"/><circle cx="45" cy="13" r=".9" fill="#fff"/></svg></div>
  <div class="fish turtle" style="top:45%; animation-delay:6s; animation-duration:14s;"><svg viewBox="0 0 72 46" aria-hidden="true"><g fill="#8BD48C" stroke="#123B4F" stroke-width="1.8"><ellipse cx="22" cy="36" rx="9" ry="5" transform="rotate(25 22 36)"/><ellipse cx="48" cy="37" rx="9" ry="5" transform="rotate(-25 48 37)"/><ellipse cx="24" cy="9" rx="9" ry="5" transform="rotate(-25 24 9)"/><ellipse cx="47" cy="9" rx="9" ry="5" transform="rotate(25 47 9)"/><path d="M14 22 L6 19 L8 25 Z"/><circle cx="61" cy="22" r="7.5"/></g><ellipse cx="35" cy="23" rx="21" ry="14.5" fill="#3FAF6A" stroke="#123B4F" stroke-width="2"/><path d="M28 13 L42 13 L48 23 L42 33 L28 33 L22 23 Z" fill="#5FCB7E" stroke="#2E8B57" stroke-width="1.6"/><circle cx="63.5" cy="20" r="1.8" fill="#123B4F"/><path d="M64 25 Q62 26.5 60 25.5" stroke="#123B4F" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></div>
  <h1 class="title">🌊<br>Le Lagon Magique</h1>
  <div class="stars">⭐ ✨ ⭐</div>
  <div class="cast"><span>🧜‍♀️</span><span>🏴‍☠️</span><span>🦄</span><span>🤖</span><span>🐉</span></div>
  <div class="splash-buddy" id="splash-buddy" hidden></div>
  <div class="hello" id="splash-hello">En route pour l'aventure ?</div>
  <button class="btn-primary" id="btn-splash-play">Jouer 🎮</button>
  <div class="waves"></div>
</div>
<div id="welcome">
  <h1>🌊 Le Lagon Magique</h1>
  <p class="sub">Bienvenue dans le lagon ✨</p>
  <div class="welcome-card">
    <label for="name-input">Comment tu t'appelles ?</label>
    <input id="name-input" type="text" maxlength="12" placeholder="Ton prénom" autocomplete="off">
    <label>Choisis ton avatar</label>
    <div class="avatar-grid" id="avatar-grid"></div>
    <div id="welcome-extra"></div>
    <button class="btn-primary" id="btn-start">C'est parti ! 🎮</button>
  </div>
</div>
<div id="turn-overlay"></div>
<div id="confetti"></div>
<div id="toast"></div>

<script src="js/entities/companion/companions.js"></script>
<script src="js/features/party/party.js"></script>
<script src="js/story.js"></script>
<script src="js/episodes.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>

</body>
